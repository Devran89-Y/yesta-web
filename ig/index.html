<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Yesta — kostenlos für Android und iPhone</title>
<meta name="robots" content="noindex">
<meta name="description" content="Yesta: dein Tag aus allen Jahren. Kostenlos für Android und iPhone, ohne Konto, ohne Cloud.">
<meta property="og:title" content="Yesta – Erinnerungen &amp; Tagebuch">
<meta property="og:description" content="Jeden Morgen deine Fotos von heute aus früheren Jahren. Ohne Konto, ohne Cloud.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yesta">
<meta property="og:locale" content="de_DE">
<meta property="og:url" content="https://yesta.app/ig">
<meta property="og:image" content="https://yesta.app/bilder/vorschau.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { color-scheme: light dark; --ground:#FFFCFA; --ink:#241B17; --muted:#7C6A62; --coral:#E04A2C; --line:#E7DCD5; }
  @media (prefers-color-scheme: dark) { :root { --ground:#171210; --ink:#F4EBE5; --muted:#B6A197; --coral:#FF7C5C; --line:#3A2E28; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem 1.25rem;
         background:var(--ground); color:var(--ink);
         font:400 1.0625rem/1.6 "Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Arial,sans-serif; }
  main { max-width:26rem; text-align:center; }
  h1 { font-size:1.5rem; line-height:1.25; margin:0 0 .75rem; }
  p { color:var(--muted); margin:0 0 1.25rem; }
  a.knopf { display:inline-block; padding:.85rem 1.5rem; border-radius:999px; text-decoration:none;
            background:var(--coral); color:#fff; font-weight:600; }
  a.leise { color:var(--muted); font-size:.9375rem; }
  .warte, .beide { display:none; }
  :root[data-weiter] .warte { display:block; }
  :root[data-beide] .beide { display:block; }
  .knoepfe { display:flex; flex-direction:column; gap:.75rem; align-items:center; margin-bottom:1.25rem; }
  hr { border:0; border-top:1px solid var(--line); margin:1.75rem 0 1rem; }
</style>
</head>
<body data-apple-pt="129622336" data-quelle="instagram" data-kampagne="start">
<main>
  <div class="warte">
    <h1>Einen Moment — wir bringen dich zu Yesta.</h1>
    <p>Falls nichts passiert:</p>
    <div class="knoepfe">
      <a class="knopf ziel-play" href="https://play.google.com/store/apps/details?id=com.yesta.app">Yesta bei Google Play</a>
      <a class="knopf ziel-apple" href="https://apps.apple.com/app/id6823133458">Yesta im App Store</a>
    </div>
  </div>
  <div class="beide">
    <h1>Yesta gibt es für Android und iPhone.</h1>
    <p>Kostenlos, ohne Konto und ohne Cloud – die App läuft ganz auf dem Handy.</p>
    <div class="knoepfe">
      <a class="knopf ziel-play" href="https://play.google.com/store/apps/details?id=com.yesta.app">Google Play (Android)</a>
      <a class="knopf ziel-apple" href="https://apps.apple.com/app/id6823133458">App Store (iPhone)</a>
    </div>
    <p><a class="leise" href="https://yesta.app/">Ansehen, worum es geht →</a></p>
  </div>
</main>
<script>
/* Kurzer Weg in den Store, je nach Geraet: Android zu Google Play, iPhone/iPad
   in den App Store, alle anderen sehen beide Knoepfe. referrer landet in der
   Play Console, pt/ct in App Store Connect (Kampagnen). Absichtlich inline:
   eine eigene Datei kann fehlschlagen, und dann faellt die Weiterleitung aus. */
(function () {
  var b = document.body, h = document.documentElement;
  var quelle = b.getAttribute('data-quelle') || 'direkt';
  var play = 'https://play.google.com/store/apps/details?id=com.yesta.app&referrer='
    + encodeURIComponent('utm_source=' + quelle + '&utm_campaign=' + (b.getAttribute('data-kampagne') || 'start'));
  var pt = b.getAttribute('data-apple-pt') || '';
  var apple = 'https://apps.apple.com/app/id6823133458' + (pt ? '?pt=' + pt + '&ct=' + encodeURIComponent(quelle) + '&mt=8' : '');
  var i, l = document.querySelectorAll('a.ziel-play');
  for (i = 0; i < l.length; i++) { l[i].href = play; }
  l = document.querySelectorAll('a.ziel-apple');
  for (i = 0; i < l.length; i++) { l[i].href = apple; }
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (/android/i.test(ua)) { h.setAttribute('data-weiter', ''); location.replace(play); return; }
  if (ios) { h.setAttribute('data-weiter', ''); location.replace(apple); return; }
  h.setAttribute('data-beide', '');
})();
</script>
</body>
</html>
